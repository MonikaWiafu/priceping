<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>PricePing</title>
<style>
:root{
  --bg:#EEF1F4;--card:#FFFFFF;--ink:#0F1111;--muted:#565959;--line:#DDE1E6;
  --head:#131A26;--head2:#1F2A3B;--head-ink:#FFFFFF;
  --accent:#FFB020;--accent-ink:#111;--accent-press:#F0A10E;
  --link:#0A6F8F;--brand:#0E7C66;--brand-soft:#E3F3EF;
  --deal:#CC0C39;--down:#0E8A4F;--up:#C2410C;--warn:#A15C07;--warn-soft:#FEF3C7;--star:#F5A623;
  --shadow:0 1px 2px rgba(16,24,40,.06);--r:12px;
}
html[data-theme=dark]{
  --bg:#0E1116;--card:#181D24;--ink:#E8ECF1;--muted:#9AA4AE;--line:#2A313A;
  --head:#0A0E14;--head2:#151C27;
  --link:#5CC8E6;--brand:#3CC3A2;--brand-soft:#16302A;
  --deal:#FF5C7A;--down:#4ADE80;--up:#FB923C;--warn:#FBBF24;--warn-soft:#3A2E10;--shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Roboto,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:disabled{opacity:.55}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn svg.i,.chip svg.i{width:18px;height:18px}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- search header ---------- */
.shead{position:sticky;top:0;z-index:5;background:var(--head);color:var(--head-ink);padding:10px 12px 0}
.brandrow{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:-.01em;margin:0 2px 8px}
.brandrow .logo{width:26px;height:26px;border-radius:7px;background:var(--accent);color:#111;display:grid;place-items:center}
.brandrow .logo svg.i{width:16px;height:16px;stroke-width:2.4}
.brandrow small{font-weight:500;opacity:.65;margin-left:auto;font-size:12px}
.sbar{display:flex;border-radius:10px;overflow:hidden;background:#fff;height:46px}
.sbar input{flex:1;min-width:0;border:0;outline:none;padding:0 12px;font:inherit;font-size:16px;color:#111;background:#fff}
.sbar .clear{width:40px;color:#666;display:grid;place-items:center}
.sbar .go{width:54px;background:var(--accent);color:#111;display:grid;place-items:center}
.sbar .go:active{background:var(--accent-press)}
.storebar{display:flex;gap:6px;overflow-x:auto;padding:10px 0 10px;scrollbar-width:none}
.storebar::-webkit-scrollbar{display:none}
.schip{flex:none;display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:999px;background:var(--head2);color:#DDE3EA;font-size:13px;border:1px solid transparent}
.schip.on{border-color:var(--accent);color:#fff}
.schip.off{opacity:.45}
.schip b{font-weight:700;color:var(--accent)}
.schip .dot{width:7px;height:7px;border-radius:50%;background:#7B8794}
.schip svg.i{width:14px;height:14px}

.toolbar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:var(--shead-h,128px);z-index:4}
.toolbar .count{flex:1;font-size:13px;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toolbar .count b{color:var(--ink)}
.selwrap{position:relative}
.selwrap select{appearance:none;-webkit-appearance:none;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:13px;padding:0 28px 0 10px;outline:none}
.selwrap::after{content:"";position:absolute;right:11px;top:13px;width:6px;height:6px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);pointer-events:none}
.fbtn{height:34px;padding:0 10px;border-radius:9px;border:1px solid var(--line);display:flex;align-items:center;gap:5px;font-size:13px;background:var(--bg)}
.fbtn svg.i{width:16px;height:16px}
.fbtn .n{background:var(--accent);color:#111;border-radius:999px;font-size:11px;font-weight:700;padding:0 6px}

/* ---------- result cards ---------- */
.results{padding:8px 8px 96px}
.rcard{display:flex;gap:12px;background:var(--card);border-radius:var(--r);padding:12px;margin-bottom:8px;box-shadow:var(--shadow);border:1px solid var(--line);position:relative;width:100%;text-align:left}
.rcard:active{transform:scale(.995)}
.rimg{width:112px;height:128px;flex:none;border-radius:8px;background:#fff;display:grid;place-items:center;overflow:hidden}
.rimg img{max-width:100%;max-height:100%;object-fit:contain}
.rimg.ph{color:#9AA4AE}
.rbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.rtitle{font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.stars{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--link)}
.st{position:relative;display:inline-block;font-size:13px;letter-spacing:1px;line-height:1;color:#D5D9D9}
.st i{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;color:var(--star);font-style:normal}
.price{display:flex;align-items:flex-start;gap:1px;font-weight:500;color:var(--ink);margin-top:2px;font-variant-numeric:tabular-nums}
.price sup{font-size:12px;line-height:1;margin-top:4px}
.price .w{font-size:26px;line-height:1}
.priceline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.off{background:var(--deal);color:#fff;font-size:12px;font-weight:700;padding:2px 6px;border-radius:5px}
.was{font-size:12px;color:var(--muted)}
.was s{font-variant-numeric:tabular-nums}
.meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:4px;padding-right:44px}
.store{font-size:11px;font-weight:700;letter-spacing:.02em;padding:2px 7px;border-radius:5px;color:#fff}
.s-amazon{background:#232F3E}.s-walmart{background:#0071DC}.s-bestbuy{background:#0046BE}.s-target{background:#CC0000}.s-ebay{background:#86B817}.s-newegg{background:#E67E22}.s-other{background:#6B7280}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.tag.cheap{color:var(--down);border-color:var(--down);font-weight:700}
.trk{position:absolute;right:8px;bottom:8px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--ink)}
.trk.on{background:var(--brand);color:#fff}
.trk svg.i{width:19px;height:19px}

.skel{height:150px;border-radius:var(--r);margin-bottom:8px;background:linear-gradient(90deg,var(--card) 0%,var(--line) 50%,var(--card) 100%);background-size:200% 100%;animation:sh 1.2s infinite linear}
@keyframes sh{to{background-position:-200% 0}}
.note{margin:6px 4px 10px;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--ink);font-size:13px}

/* ---------- generic ---------- */
header.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;padding:10px 10px 10px 16px;background:var(--bg)}
h1{font-size:22px;margin:0;flex:1;letter-spacing:-.01em;min-width:0}
h1.sm{font-size:17px;font-weight:600}
.icon-btn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.icon-btn:active{background:var(--line)}
main{padding:0 14px 96px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line)}
.pad{padding:14px}
.btn{height:46px;padding:0 16px;border-radius:12px;font-weight:700;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{background:var(--accent-press)}
.btn.brand{background:var(--brand);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn.danger{background:transparent;color:var(--up);border:1px solid var(--line);font-weight:600}
.btn.danger-fill{background:var(--up);color:#fff}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.wide{width:100%;margin-top:12px}
.sub{color:var(--muted);font-size:13px}
.clamp1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.end{justify-content:flex-end}
.grow{flex:1;min-width:0}
.center{text-align:center}
.section-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:20px 4px 8px}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--brand-soft);color:var(--brand);font-weight:600;white-space:nowrap}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:none}
.row input{flex:1;width:auto;min-width:0}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:600}
.toast{position:fixed;left:14px;right:14px;bottom:80px;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;z-index:40;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;font-size:14px}
.toast.show{opacity:1;transform:none}

/* ---------- bottom nav ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;height:62px;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:10}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted);position:relative}
nav.tabs button.on{color:var(--ink);font-weight:700}
nav.tabs button.on svg.i{color:var(--accent)}
nav.tabs .cnt{position:absolute;top:7px;left:calc(50% + 6px);background:var(--deal);color:#fff;font-size:10px;font-weight:700;border-radius:999px;padding:0 5px;min-width:16px;text-align:center}

/* ---------- product page ---------- */
.pimg{background:#fff;height:280px;display:grid;place-items:center;border-radius:var(--r);overflow:hidden;padding:12px}
.pimg img{max-width:100%;max-height:100%;object-fit:contain}
.ptitle{font-size:17px;line-height:1.35;margin:14px 2px 6px}
.bigprice .w{font-size:34px}
.cmp{display:flex;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.cmp:first-child{border-top:0}
.cmp img{width:52px;height:52px;object-fit:contain;background:#fff;border-radius:8px;flex:none}
.cmp .t{font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cmp .pp{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.ck{width:22px;height:22px;flex:none;accent-color:var(--brand);margin:0;padding:0}

/* ---------- watchlist (from v1) ---------- */
.item{display:flex;gap:12px;padding:12px;margin-bottom:10px;align-items:center;width:100%;text-align:left}
.thumb{width:64px;height:64px;border-radius:10px;background:#fff;object-fit:contain;flex:none;border:1px solid var(--line)}
.thumb.ph{display:grid;place-items:center;color:var(--brand);background:var(--brand-soft);border:0}
.name{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.big{font-size:32px;font-weight:800;letter-spacing:-.02em;margin-top:8px;font-variant-numeric:tabular-nums}
.delta{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.down{color:var(--down)}.up{color:var(--up)}
.hero-img{width:100%;height:190px;object-fit:contain;background:#fff;border-radius:var(--r) var(--r) 0 0;display:block;padding:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.stats b{display:block;font-variant-numeric:tabular-nums}
.listing{padding:12px 14px;display:flex;gap:10px;align-items:flex-start;border-top:1px solid var(--line)}
.listing:first-child{border-top:0}
.right{text-align:right;flex:none}
.err{color:var(--warn);font-size:13px;margin-top:4px}
.empty{text-align:center;padding:30px 8px;color:var(--muted)}
.empty .bdg{width:68px;height:68px;border-radius:20px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;margin:0 auto}
.empty .bdg svg.i{width:34px;height:34px}
.empty h2{color:var(--ink);font-size:20px;margin:14px 0 6px}
.banner{display:flex;gap:10px;align-items:center;padding:12px;margin-bottom:12px;background:var(--warn-soft);border-radius:var(--r);font-size:14px}
.banner svg.i{color:var(--warn)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:14px}
.seg button.on{background:var(--ink);color:var(--card);border-color:var(--ink);font-weight:600}
.set-row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--line)}
.set-row:first-child{border-top:0}
.set-block{padding:13px 14px;border-top:1px solid var(--line)}
.set-block:first-child{border-top:0}
.tog{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;padding:0;border:0;margin:0;cursor:pointer;transition:background .15s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.tog:checked{background:var(--brand)}
.tog:checked::after{left:21px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20;align-items:flex-end}
.sheet-bg.open{display:flex}
.sheet{width:100%;max-height:90vh;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;padding:20px 16px 22px;animation:up .18s ease-out}
.sheet h3{margin:0 0 6px;font-size:19px}
.sheet .row.end{margin-top:18px}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.chart{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font-size:10px;font-family:inherit}
.legend{display:flex;flex-wrap:wrap;gap:12px;padding:0 14px 12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.about p{margin:0 0 10px}.about p:last-child{margin:0}
</style>
</head>
<body>
<div id="view"></div>
<nav class="tabs" id="tabs"></nav>
<div id="sheet" class="sheet-bg"><div class="sheet" id="sheetBody"></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
const A = window.Android || previewBridge();
const STORES = [
  {key: 'amazon', name: 'Amazon'}, {key: 'walmart', name: 'Walmart'}, {key: 'bestbuy', name: 'Best Buy'},
  {key: 'target', name: 'Target'}, {key: 'ebay', name: 'eBay'}, {key: 'newegg', name: 'Newegg'}
];
const SORTS = [
  ['featured', 'Featured'], ['low', 'Price: Low to High'], ['high', 'Price: High to Low'],
  ['rating', 'Avg. Customer Review'], ['reviews', 'Most Reviews'], ['discount', 'Biggest Discount']
];
let S = {items: [], settings: {}};
let tab = 'search';
let view = {name: 'home'};          // watchlist sub-view
let product = null;                  // open search product
const search = {q: '', token: '', res: {}, sort: 'featured', f: {min: '', max: '', rating: 0, hideSponsored: false, newOnly: false, stores: null}};
let dirty = false, sheetOpen = false, busy = false, pendingAsk = null, picked = new Set();
const $ = s => document.querySelector(s);

// ---------- helpers ----------
const ICONS = {
  search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  x: '<path d="M18 6L6 18M6 6l12 12"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  refresh: '<path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
  back: '<path d="M15 18l-6-6 6-6"/>',
  ext: '<path d="M14 3h7v7"/><path d="M10 14L21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/>',
  trash: '<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/>',
  bell: '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
  bellOn: '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/><path d="M9.5 10.5l2 2 3.5-3.5"/>',
  tag: '<path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z"/><circle cx="7" cy="7" r="1.5"/>',
  edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  filter: '<path d="M4 6h16M7 12h10M10 18h4"/>',
  list: '<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/>',
  check: '<path d="M20 6L9 17l-5-5"/>',
  alert: '<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  img: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>',
  link: '<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>'
};
const ic = (n, cls) => `<svg class="i ${cls || ''}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const safeImg = u => (typeof u === 'string' && /^https:\/\//i.test(u)) ? u : '';
const storeKey = name => (STORES.find(s => s.name === name) || {}).key || 'other';
function money(v, cur, noCents) {
  if (v == null || isNaN(v)) return '—';
  try {
    return new Intl.NumberFormat('en-US', {style: 'currency', currency: cur || 'USD',
      maximumFractionDigits: noCents ? 0 : 2, minimumFractionDigits: noCents ? 0 : 2}).format(v);
  } catch (e) { return '$' + Number(v).toFixed(noCents ? 0 : 2); }
}
function priceHtml(v, cls) {
  if (v == null) return '';
  const [w, c] = Number(v).toFixed(2).split('.');
  return `<span class="price ${cls || ''}"><sup>$</sup><span class="w">${Number(w).toLocaleString('en-US')}</span><sup>${c}</sup></span>`;
}
function starsHtml(r, n) {
  if (!r) return '';

  h += `<div class="section-title">Price alert</div><div class="card pad">
    <label for="target" style="margin-top:0">Ping me when the price is at or below</label>
    <div class="row" style="flex-wrap:nowrap"><input id="target" type="number" inputmode="decimal" step="0.01" min="0" placeholder="e.g. 199.99" value="${it.target != null ? esc(it.target) : ''}">
    <button class="btn" data-act="setTarget" data-id="${id}">Set</button>
    ${it.target != null ? `<button class="btn ghost" data-act="clearTarget" data-id="${id}">Clear</button>` : ''}</div>
    <p class="sub" style="margin:10px 0 0">${st.notifyMode === 'target' ? 'You only get alerts when a price reaches this target.'
      : `You also get alerts for any drop${Number(st.minDropPct) ? ` of ${Number(st.minDropPct)}% or more` : ''}. Change this in Settings.`}</p></div>`;
  const ch = chart(it);
  if (ch) h += `<div class="section-title">Price history</div><div class="card">${ch}</div>`;
  h += `<div class="section-title">Stores</div><div class="card">`;
  if (!ls.length) h += `<div class="pad sub">No store links yet.</div>`;
  ls.forEach(l => {
    const isBest = b && l.id === b.id && np > 1;
    h += `<div class="listing"><div class="grow">
      <div class="row" style="gap:6px"><b>${esc(l.store)}</b>${isBest ? '<span class="badge">Best</span>' : ''}${l.inStock === false ? '<span class="badge warn">Out of stock</span>' : ''}</div>
      <div class="sub clamp1">${l.title && l.title !== it.name ? esc(l.title) + ' · ' : ''}checked ${ago(l.lastChecked)}</div>
      ${l.error ? `<div class="err">${esc(l.error)}</div>` : ''}
      <div class="row" style="margin-top:8px"><button class="btn sm ghost" data-act="openLink" data-id="${id}" data-lid="${esc(l.id)}">${ic('ext')}Open</button>
      <button class="btn sm ghost" data-act="rmListing" data-id="${id}" data-lid="${esc(l.id)}">${ic('trash')}Remove</button></div></div>
      <div class="right"><div class="pr">${money(l.price, l.currency)}</div>${changeChip(l.price, l.price != null ? prevPrice(l) : null)}</div></div>`;
  });
  h += `</div><button class="btn ghost wide" data-act="findMore" data-id="${id}">${ic('search')}Find this at more stores</button>
    <button class="btn ghost wide" data-act="addHere" data-id="${id}">${ic('link')}Add a store link</button>
    <button class="btn danger wide" data-act="rmItem" data-id="${id}">${ic('trash')}Stop tracking</button>`;
  return h + '</main>';
}
function chart(it) {
  const COLORS = ['#0E7C66', '#6366F1', '#E11D48', '#D97706', '#0891B2', '#9333EA', '#65A30D'];
  const series = (it.listings || []).filter(l => (l.history || []).length).map((l, i) => ({
    name: l.store, color: COLORS[i % COLORS.length], pts: l.history.map(p => [Number(p[0]), Number(p[1])])
  }));
  if (!series.length) return '';
  const now = Date.now();
  series.forEach(s => s.pts.push([now, s.pts[s.pts.length - 1][1]]));
  let t0 = Infinity, t1 = -Infinity, p0 = Infinity, p1 = -Infinity;
  series.forEach(s => s.pts.forEach(([t, p]) => { t0 = Math.min(t0, t); t1 = Math.max(t1, t); p0 = Math.min(p0, p); p1 = Math.max(p1, p); }));
  if (t1 - t0 < 3600e3) t0 = t1 - 3600e3;
  if (p1 - p0 < 0.01) { p0 = p0 * 0.95; p1 = p1 * 1.05 + 0.01; }
  const pad = (p1 - p0) * 0.12; p0 = Math.max(0, p0 - pad); p1 += pad;
  const W = 340, H = 160, L = 48, R = 10, T = 12, B = 22;
  const x = t => (L + (t - t0) / (t1 - t0) * (W - L - R)).toFixed(1);
  const y = p => (T + (p1 - p) / (p1 - p0) * (H - T - B)).toFixed(1);
  const noCents = (p1 - p0) > 30;
  let g = '';
  for (let k = 0; k <= 3; k++) {
    const v = p0 + (p1 - p0) * k / 3, yy = y(v);
    g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${Number(yy) + 3}" text-anchor="end">${money(v, 'USD', noCents)}</text>`;
  }
  const d = t => new Date(t).toLocaleDateString('en-US', {month: 'short', day: 'numeric'});
  g += `<text x="${L}" y="${H - 6}">${d(t0)}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">Now</text>`;
  const lines = series.map(s => {
    let p = '';
    s.pts.forEach(([t, v], i) => { p += i === 0 ? `M${x(t)},${y(v)}` : `H${x(t)}V${y(v)}`; });
    const [lt, lv] = s.pts[s.pts.length - 1];
    return `<path d="${p}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round"/><circle cx="${x(lt)}" cy="${y(lv)}" r="3.2" fill="${s.color}"/>`;
  }).join('');
  const legend = series.length > 1 ? `<div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>` : '';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Price history">${g}${lines}</svg>${legend}`;
}

// ---------- sheets ----------

function closeSheet() { $('#sheet').classList.remove('open'); sheetOpen = false; busy = false; pendingAsk = null; if (dirty) render(); }

// ---------- tracking ----------
function asListing(it) { return {url: it.url, store: it.store, price: it.price, title: it.title, image: it.image, inStock: it.inStock == null ? null : it.inStock}; }
function track(main, others) {
  if (busy) return;
  busy = true;
  A.trackProducts(JSON.stringify({name: main.title, listings: [asListing(main)].concat((others || []).map(asListing))}));
}

// ---------- actions ----------
const ACT = {
  tab: id => { tab = id; if (id === 'watch') view = {name: 'home'}; render(); window.scrollTo(0, 0); },
  searchFor: q => { const i = $('#q'); if (i) i.value = q; doSearch(q); },
  clearQ: () => { search.q = ''; search.res = {}; product = null; render(); setTimeout(() => $('#q') && $('#q').focus(), 50); },
  storeChip: k => {
    const cur = search.f.stores;
    if (!cur) search.f.stores = [k];
    else if (cur.length === 1 && cur[0] === k) search.f.stores = null;
    else search.f.stores = cur.includes(k) ? cur.filter(x => x !== k) : cur.concat(k);
    if (search.f.stores && !search.f.stores.length) search.f.stores = null;
    render();
  },
  filters: () => openFilters(),
  fRate: v => { search.f.rating = Number(v); document.querySelectorAll('#frate button').forEach(b => b.classList.toggle('on', b.dataset.id === String(v))); },
  fReset: () => { Object.assign(search.f, {min: '', max: '', rating: 0, hideSponsored: false, newOnly: false}); closeSheet(); render(); },
  fApply: () => {
    search.f.min = $('#fmin').value.trim(); search.f.max = $('#fmax').value.trim();
    search.f.newOnly = $('#fnew').checked; search.f.hideSponsored = $('#fsp').checked;
    closeSheet(); render(); window.scrollTo(0, 0);
  },
  openProduct: (k, url) => {
    const it = findResult(k, url); if (!it) return;
    product = it;
    picked = new Set(matchesFor(it).filter(x => x.s >= 0.9).map(x => x.o.storeKey + '|' + x.o.url));
    tab = 'search'; render(); window.scrollTo(0, 0);
  },
  closeProduct: () => { product = null; render(); },
  quickTrack: (k, url) => {
    const it = findResult(k, url); if (!it) return;
    const tid = trackedUrls()[canon(it.url)];
    if (tid) { tab = 'watch'; view = {name: 'item', id: tid}; render(); window.scrollTo(0, 0); return; }
    track(it, []);
  },
  trackOne: () => track(product, []),
  trackAll: () => {
    const others = [...picked].map(k => { const [sk, ...u] = k.split('|'); return findResult(sk, u.join('|')); }).filter(Boolean);
    if (!others.length) return toast('Tick at least one other store first.');
    track(product, others);
  },
  gotoItem: id => { tab = 'watch'; view = {name: 'item', id}; product = null; render(); window.scrollTo(0, 0); },
  openUrl: u => A.openUrl(u),
  findMore: id => { const it = findItem(id); if (!it) return; tab = 'search'; doSearch(it.name.split(/[,(|]/)[0].slice(0, 80)); },
  // watchlist
  item: id => { view = {name: 'item', id}; render(); window.scrollTo(0, 0); },
  watchHome: () => { view = {name: 'home'}; render(); window.scrollTo(0, 0); },
  addLink: () => openAdd('', ''),
  addHere: id => openAdd('', id),
  checkAll: () => { if (!S.items.length) return toast('Track something first.'); A.checkNow(''); toast('Checking prices… this takes a few seconds per store.'); },
  checkItem: id => { A.checkNow(id); toast('Checking this item…'); },
  openLink: (id, lid) => { const it = findItem(id); const l = it && (it.listings || []).find(x => x.id === lid); if (l) A.openUrl(l.url); },
  rmListing: (id, lid) => {
    const it = findItem(id), l = it && (it.listings || []).find(x => x.id === lid);
    ask('Remove this store?', `${l ? l.store : 'This store'} will no longer be checked for this item.`, 'Remove', () => A.removeListing(id, lid));
  },
  rmItem: id => ask('Stop tracking this item?', 'Its price history will be deleted.', 'Delete', () => { A.removeItem(id); view = {name: 'home'}; render(); }),
  rename: id => {
    const it = findItem(id); if (!it) return;
    openSheet(`<h3>Rename item</h3><label for="rn">Name</label><input id="rn" maxlength="160">
      <div class="row end"><button class="btn ghost" data-act="sheetClose">Cancel</button><button class="btn" data-act="renameOk" data-id="${esc(id)}">Save</button></div>`);
    $('#rn').value = it.name;
  },
  renameOk: id => { const v = $('#rn').value.trim(); if (v) A.renameItem(id, v); closeSheet(); },
  setTarget: id => {
    const v = $('#target').value.trim();
    if (!v || !(Number(v) > 0)) return toast('Enter a price, like 199.99');
    $('#target').blur(); A.setTarget(id, v); toast(`You'll be pinged at ${money(Number(v))} or less.`);
  },
  clearTarget: id => { A.setTarget(id, ''); toast('Target price cleared.'); },
  notif: () => A.requestNotifications(),
  testNotif: () => { A.testNotification(); toast('Test alert sent.'); },
  set: (id, lid, b) => { const k = b.dataset.k; let v = b.dataset.v; if (k !== 'notifyMode') v = Number(v); A.saveSettings(JSON.stringify({[k]: v})); },
  export: () => A.exportData(),
  import: () => openSheet(`<h3>Restore a backup</h3><div class="sub">This replaces your current watchlist.</div>
      <label for="imp">Backup text</label><textarea id="imp" rows="6" placeholder='{"items":[…]}'></textarea>
      <div class="row end"><button class="btn ghost" data-act="sheetClose">Cancel</button><button class="btn" data-act="importOk">Restore</button></div>`),
  importOk: () => { const r = A.importData($('#imp').value); if (r === 'ok') { closeSheet(); load(); render(); toast('Backup restored.'); } else toast(r); },
  sheetClose: () => closeSheet(),
  askOk: () => { const f = pendingAsk; closeSheet(); if (f) f(); },
  sheetAdd: (id, lid, btn) => {
    const u = $('#url').value.trim();
    if (!/https?:\/\//i.test(u)) return toast('Paste a full product link (starting with https://).');
    if (busy) return;
    busy = true; btn.disabled = true; btn.innerHTML = `${ic('refresh', 'spin')}Checking…`;
    A.addLink(u, $('#to').value || '');
  }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  if (b.dataset.act !== 'quickTrack' && e.target.closest('.trk')) return;
  if (b.classList.contains('rcard') && e.target.closest('.trk')) return;
  e.preventDefault();
  const f = ACT[b.dataset.act];
  if (f) f(b.dataset.id || '', b.dataset.lid || '', b);
});
document.addEventListener('submit', e => { if (e.target.id === 'sform') { e.preventDefault(); doSearch($('#q').value); } });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'sort') { search.sort = t.value; t.blur(); render(); window.scrollTo(0, 0); return; }
  if (t.dataset && t.dataset.pick) { t.checked ? picked.add(t.dataset.pick) : picked.delete(t.dataset.pick); render(); return; }
  if (t.dataset && t.dataset.store) {
    const on = new Set(S.settings.stores); t.checked ? on.add(t.dataset.store) : on.delete(t.dataset.store);
    if (!on.size) { t.checked = true; return toast('Keep at least one store.'); }
    A.setStores(STORES.map(s => s.key).filter(k => on.has(k)).join(','));
    return;
  }
  if (t.dataset && t.dataset.set) A.saveSettings(JSON.stringify({[t.dataset.set]: t.checked}));
});
document.addEventListener('focusout', () => setTimeout(() => { if (dirty) render(); }, 0));

// ---------- messages from the app ----------
function handlePending(p) {
  if (!p) return;
  if (p.toast) toast(p.toast);
  if (p.openItem && findItem(p.openItem)) { if (sheetOpen) closeSheet(); tab = 'watch'; view = {name: 'item', id: p.openItem}; render(); }
  if (p.sharedUrl) { tab = 'watch'; render(); openAdd(p.sharedUrl, view.name === 'item' ? view.id : ''); }
}
window.onNative = function (raw) {
  let m; try { m = JSON.parse(raw); } catch (e) { return; }
  if (m.type === 'search') {
    if (m.token !== search.token) return;
    search.res[m.store] = {status: m.status, items: (m.items || []).filter(i => i.price != null)};
    if (!product) render();
  } else if (m.type === 'state') { load(); render(); }
  else if (m.type === 'pending') { load(); render(); handlePending(m); }
  else if (m.type === 'toast') toast(m.text);
  else if (m.type === 'checked') {
    load(); render();
    toast(m.count < 0 ? 'Already checking. Hang on.' : m.count > 0 ? `Done: ${m.count} price alert${m.count > 1 ? 's' : ''}!` : 'Prices checked.');
  } else if (m.type === 'tracked') {
    busy = false; load(); render();
    if (m.ok) {
      toast(m.added > 1 ? `Tracking ${m.added} stores. You'll be pinged when prices drop.` : `Tracking. You'll be pinged when the price drops.`);
      let asked = false; try { asked = localStorage.getItem('askedNotif') === '1'; localStorage.setItem('askedNotif', '1'); } catch (e) {}
      if (!S.notifOk && !asked) setTimeout(() => A.requestNotifications(), 900);
    } else toast(m.error || 'Could not track that.');
  } else if (m.type === 'added') {
    busy = false;
    if (m.ok) {
      closeSheet(); load(); tab = 'watch'; view = {name: 'item', id: m.itemId}; render(); window.scrollTo(0, 0);
      toast(m.found ? `Added: ${money(m.price)} at ${m.store}` : `Added, but no price yet. ${m.error || ''}`);
    } else {
      toast(m.error || 'Could not add that link.');
      const b = document.querySelector('[data-act=sheetAdd]');
      if (b) { b.disabled = false; b.innerHTML = 'Add &amp; check price'; }
    }
  }
};
window.goBack = function () {
  if (sheetOpen) { if (!busy) closeSheet(); return true; }
  if (tab === 'search' && product) { product = null; render(); return true; }
  if (tab === 'watch' && view.name !== 'home') { ACT.watchHome(); return true; }
  if (tab !== 'search') { ACT.tab('search'); return true; }
  if (Object.keys(search.res).length) { ACT.clearQ(); $('#q') && $('#q').blur(); return true; }
  return false;
};

// Lets the screens be previewed in a normal browser (no phone needed).
function previewBridge() {
  const day = 864e5, now = Date.now();
  const st = {dark: false, notifOk: false, checking: false,
    settings: {intervalHours: 6, notifyMode: 'any', minDropPct: 1, wifiOnly: false, notifyStock: true, lastRun: now - 2 * 3600e3, stores: ['amazon', 'walmart', 'bestbuy', 'target', 'ebay', 'newegg']},
    items: [{id: 'a1', name: 'Sony WH-1000XM5 Wireless Noise Canceling Headphones', target: 300, listings: [
      {id: 'l1', store: 'Amazon', url: 'https://www.amazon.com/dp/B09XS7JWHH', price: 328, lowest: 298, lastChecked: now - 3600e3, history: [[now - 20 * day, 399.99], [now - 9 * day, 348], [now - 2 * day, 328]]},
      {id: 'l2', store: 'Best Buy', url: 'https://www.bestbuy.com/x', price: 349.99, lowest: 329.99, lastChecked: now - 3600e3, history: [[now - 18 * day, 399.99], [now - 6 * day, 349.99]]}]}]};
  const push = m => setTimeout(() => window.onNative(JSON.stringify(m)), 200);
